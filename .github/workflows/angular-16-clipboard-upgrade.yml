name: Upgrade Angular 16 Ivy clipboard dependency
on:
  push:
    branches: ['upgrade/angular-16']
permissions:
  contents: write
jobs:
  upgrade:
    if: github.repository == 'twister65/Nault' && startsWith(github.event.head_commit.message, 'deps(angular16)')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'upgrade/angular-16'
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '18.20.8'
          cache: npm
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Reinstall from committed Angular 16 lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Upgrade ngx-clipboard to Ivy-compatible major 16
        run: npm install --save --save-exact --legacy-peer-deps --no-audit --no-fund ngx-clipboard@16.0.0
      - name: Verify versions and commit isolated changes
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');if(p.dependencies['ngx-clipboard']!=='16.0.0')throw Error('Clipboard version mismatch');if(p.devDependencies.webpack!=='5.94.0')throw Error('Webpack mismatch')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(angular16): upgrade ngx-clipboard to Ivy-compatible v16"
            git push origin HEAD:upgrade/angular-16
          fi
      - name: Validate Angular 16 Web production compilation
        run: npm run wallet:build
