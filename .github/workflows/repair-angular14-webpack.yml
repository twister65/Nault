name: Repair Angular 14 webpack resolution
on:
  push:
    branches: ['upgrade/angular-14']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'twister65/Nault' && startsWith(github.event.head_commit.message, 'fix(angular14)')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'upgrade/angular-14'
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '16.20.2'
          cache: npm
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Reinstall Angular 14 baseline
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Declare Webpack at the root and update lockfile
        run: npm install -D --save-exact webpack@5.76.1 --legacy-peer-deps --no-audit --no-fund
      - name: Commit exact package and lockfile changes to Angular branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(angular14): make webpack dependency resolvable by build-webpack"
          git push origin HEAD:upgrade/angular-14
      - name: Check clean production Angular build
        run: npm run wallet:build
