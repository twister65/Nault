name: Angular 21 deprecated dependency inventory

on:
  push:
    branches: [fix/angular-21-deprecated-dependencies]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Inventory deprecations from exact lockfile
        shell: bash
        run: |
          set -o pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund 2>&1 | tee npm-deprecations-install.log
          echo "### Deprecated packages (unique)" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'npm warn deprecated |npm WARN deprecated ' npm-deprecations-install.log | sort -u | tee deprecated-packages.txt || true
          wc -l deprecated-packages.txt | tee -a "$GITHUB_STEP_SUMMARY"
          cat deprecated-packages.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory references to legacy runtime dependencies
        shell: bash
        run: |
          node - <<'NODE' | tee legacy-import-references.txt
          const fs = require('node:fs');
          const path = require('node:path');
          const names = ['babel-polyfill', 'babel-runtime', '@angular/animations', 'rxjs-compat', '@angular/platform-browser-dynamic'];
          const roots = ['src', 'desktop-app/src', 'scripts', 'e2e'];
          let found = 0;
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) { walk(file); continue; }
              if (!/\.(ts|tsx|js|cjs|mjs|html)$/.test(entry.name)) continue;
              for (const [i, line] of fs.readFileSync(file, 'utf8').split(/\r?\n/).entries()) {
                for (const name of names) {
                  if (line.includes(name)) { console.log(file + ':' + (i + 1) + ' [' + name + '] ' + line.trim().slice(0, 160)); found++; }
                }
              }
            }
          }
          for (const dir of roots) walk(dir);
          console.log('TOTAL_MATCHES=' + found);
          NODE
      - name: Explain parent dependency chains for remaining deprecated packages
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            '@npmcli/move-file@2.0.1'
            'are-we-there-yet@3.0.1'
            'debug@3.2.6'
            'gauge@4.0.4'
            'glob@7.2.3'
            'glob@8.1.0'
            'har-validator@5.1.3'
            'npmlog@6.0.2'
            'querystring@0.2.0'
            'request@2.88.2'
            'uuid@3.4.0'
            'uuid@8.3.2'
          )
          : > deprecated-parents.txt
          for package in "${packages[@]}"; do
            printf '\n### %s\n' "$package" | tee -a deprecated-parents.txt
            npm explain "$package" 2>&1 | tee -a deprecated-parents.txt || true
          done
      - name: Snapshot npm security advisories separately from deprecations
        shell: bash
        run: |
          # An audit failure due to advisories is expected; preserve the report without
          # making this diagnostic inventory an alternative to the security merge gate.
          npm audit --json --audit-level=low > npm-audit-results.json || true
          node - <<'NODE' | tee dependency-vulnerability-summary.txt
          const fs = require('node:fs');
          let report;
          try { report = JSON.parse(fs.readFileSync('npm-audit-results.json', 'utf8')); }
          catch (error) { console.log('AUDIT_UNAVAILABLE: invalid JSON (' + error.message + ')'); process.exit(0); }
          const counts = report.metadata?.vulnerabilities;
          if (!counts || report.error) {
            console.log('AUDIT_UNAVAILABLE: registry/API error, do not report vulnerability totals as zero');
            process.exit(0);
          }
          for (const level of ['info', 'low', 'moderate', 'high', 'critical', 'total']) {
            console.log(level + '=' + (counts[level] ?? 'unknown'));
          }
          const direct = Object.entries(report.vulnerabilities || {})
            .filter(([, item]) => item.isDirect)
            .map(([name, item]) => ({
              name, severity: item.severity, range: item.range,
              fixAvailable: item.fixAvailable
            }));
          fs.writeFileSync('direct-vulnerability-summary.json', JSON.stringify(direct, null, 2));
          console.log('DIRECT_VULNERABLE_PACKAGES=' + direct.length);
          for (const item of direct) {
            console.log('DIRECT_RISK ' + item.name + ' severity=' + item.severity +
              ' fixAvailable=' + JSON.stringify(item.fixAvailable));
          }
          NODE
          echo '### npm audit advisories (distinct from deprecations)' >> "$GITHUB_STEP_SUMMARY"
          cat dependency-vulnerability-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Archive inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-21-deprecated-inventory
          path: |
            npm-deprecations-install.log
            deprecated-packages.txt
            deprecated-parents.txt
            legacy-import-references.txt
            npm-audit-results.json
            dependency-vulnerability-summary.txt
            direct-vulnerability-summary.json
          if-no-files-found: warn
