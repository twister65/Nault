name: Bootstrap Angular 22 patch update lockfile

# One-time isolated maintenance helper. Remove before merging the PR.
on:
  push:
    branches: [maintenance/angular-22.2.4-cli-22.2.5]
    paths:
      - package.json
      - .github/workflows/angular-22-patch-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: github.repository == 'twister65/Nault'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Regenerate reproducible npm lockfile without executing install scripts
        run: npm install --package-lock-only --lockfile-version=2 --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify matched framework and CLI/build versions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          assert.equal(lock.lockfileVersion, 2);
          const expected = new Map([
            ['@angular/common','22.2.4'], ['@angular/compiler','22.2.4'], ['@angular/core','22.2.4'],
            ['@angular/forms','22.2.4'], ['@angular/localize','22.2.4'],
            ['@angular/platform-browser','22.2.4'], ['@angular/router','22.2.4'],
            ['@angular/service-worker','22.2.4'], ['@angular/compiler-cli','22.2.4'],
            ['@angular/language-service','22.2.4'], ['@angular/build','22.2.5'],
            ['@angular/cli','22.2.5']
          ]);
          for(const [name,version] of expected) {
            assert.equal(lock.packages['node_modules/'+name]?.version, version, name+' version');
            const wanted = pkg.dependencies?.[name] ?? pkg.devDependencies?.[name];
            assert.equal(wanted,'^'+version,name+' manifest');
          }
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(lock.packages[''].dependencies['@angular/core'], pkg.dependencies['@angular/core']);
          assert.equal(lock.packages[''].devDependencies['@angular/cli'], pkg.devDependencies['@angular/cli']);
          console.log('Angular 22.2.4 framework and 22.2.5 CLI/build lockfile verified');
          NODE
      - name: Commit only the regenerated lockfile to this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'maintenance/angular-22.2.4-cli-22.2.5'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(angular): regenerate npm lockfile for stable patch releases'
          git push origin HEAD:refs/heads/maintenance/angular-22.2.4-cli-22.2.5
