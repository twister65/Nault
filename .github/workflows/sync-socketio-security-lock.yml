name: Temporary Socket.IO security lockfile sync
on:
  push:
    branches: [fix/socketio-development-security-2026-10]
    paths:
      - package.json
      - .github/workflows/sync-socketio-security-lock.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'twister65/Nault'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile via npm registry for patched Socket.IO and ws
        run: npm install --package-lock-only --lockfile-version=2 --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify patched resolved dependency graph
        run: npm run test:socketio-security
      - name: Commit regenerated lockfile only to security branch
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(security): resolve patched engine.io, socket.io-parser and ws'
          git push origin HEAD:refs/heads/fix/socketio-development-security-2026-10
