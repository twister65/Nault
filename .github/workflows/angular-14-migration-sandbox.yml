name: Angular 13 to 14 migration sandbox
on:
  push:
    branches: ['upgrade/angular-14']
permissions:
  contents: write
concurrency:
  group: angular-14-migration-sandbox
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'twister65/Nault'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout dedicated experimental branch
        uses: actions/checkout@v7
        with:
          ref: 'upgrade/angular-14'
          persist-credentials: true
      - name: Use Node.js 16 for Angular 13 and 14 compatibility
        uses: actions/setup-node@v7
        with:
          node-version: '16.20.2'
          cache: npm
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Install exact Angular 13 baseline
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Apply official Angular 14 migration schematics
        run: ./node_modules/.bin/ng update @angular/cli@14 @angular/core@14 --force
      - name: Synchronize Angular ESLint to v14
        run: |
          npm install --save-dev --legacy-peer-deps --no-audit --no-fund \
            @angular-eslint/builder@14 \
            @angular-eslint/eslint-plugin@14 \
            @angular-eslint/eslint-plugin-template@14 \
            @angular-eslint/schematics@14 \
            @angular-eslint/template-parser@14
      - name: Verify core / CLI / TypeScript compatibility
        run: |
          node -e "const p=require('./package.json'); console.log({core:p.dependencies['@angular/core'],cli:p.devDependencies['@angular/cli'],typescript:p.devDependencies.typescript}); if (!/^(\^|~)?14\./.test(p.dependencies['@angular/core'])) process.exit(1);"
          ./node_modules/.bin/ng version
      - name: Commit migration outputs to experimental branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(angular): migrate Angular 13 to 14 using official schematics"
            git push origin HEAD:upgrade/angular-14
          else
            echo "::error::Angular 14 migration produced no changes"
            exit 1
          fi
      - name: Attempt Angular 14 production Web build (do not bypass failures)
        run: npm run wallet:build
