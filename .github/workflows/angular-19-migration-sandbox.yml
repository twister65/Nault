name: Migrate Angular 18 to 19 (sandbox)
on:
  push:
    branches: ['upgrade/angular-19']
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'twister65/Nault' && startsWith(github.event.head_commit.message, 'ci(angular19)')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'upgrade/angular-19'
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.5'
          cache: npm
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Restore Angular 18 validated lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Execute Angular 19 official upgrade schematics
        run: ./node_modules/.bin/ng update @angular/cli@19 @angular/core@19 --force
      - name: Align framework and PWA dependencies
        run: |
          npm install --save --legacy-peer-deps --no-audit --no-fund \
            @angular-devkit/core@19 \
            @angular/localize@19 \
            @angular/service-worker@19 \
            zone.js@~0.15.1
      - name: Align Angular ESLint, TypeScript and type-aware lint
        run: |
          npm install --save-dev --legacy-peer-deps --no-audit --no-fund \
            @angular-eslint/builder@19 \
            @angular-eslint/eslint-plugin@19 \
            @angular-eslint/eslint-plugin-template@19 \
            @angular-eslint/schematics@19 \
            @angular-eslint/template-parser@19 \
            @angular/language-service@19 \
            typescript@~5.8.3 \
            @typescript-eslint/eslint-plugin@8.46.0 \
            @typescript-eslint/parser@8.46.0
      - name: Preserve shared Webpack instance for browser and PoW worker
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('@angular-devkit/build-angular/package.json').dependencies.webpack")"
          npm install --save-dev --save-exact --legacy-peer-deps --no-audit --no-fund "webpack@$expected"
          node -e "const path=require('path');const root=require.resolve('webpack');const angular=require.resolve('webpack',{paths:[path.dirname(require.resolve('@angular-devkit/build-angular/package.json'))]});console.log({root,angular});if(root!==angular)throw Error('Webpack installations differ')"
      - name: Verify Angular 19 compatibility versions
        run: |
          node -e "const p=require('./package.json');for(const [name,v] of Object.entries({...p.dependencies,...p.devDependencies})){if((name.startsWith('@angular/')||name.startsWith('@angular-eslint/')||name==='@angular-devkit/build-angular'||name==='@angular-devkit/core')&&!/^[~^]?19\./.test(v))throw Error(name+' '+v)}if(!/^[~^]?5\.8\./.test(p.devDependencies.typescript))throw Error('TypeScript unsupported');if(!/^[~^]?0\.15\./.test(p.dependencies['zone.js']))throw Error('Zone.js unsupported')"
          ./node_modules/.bin/ng version
      - name: Commit migrations solely to Angular 19 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(angular): migrate Angular framework and tooling from 18 to 19"
            git push origin HEAD:upgrade/angular-19
          fi
      - name: Smoke test Angular 19 Web production build
        run: npm run wallet:build
