name: Update v1.18.4 published release notes

# One-time metadata correction after verifying actual uploaded installer names.
on:
  push:
    branches: [master]
    paths:
      - docs/releases/v1.18.4.md

jobs:
  update-release-notes:
    if: github.repository == 'twister65/Nault'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Synchronize public release notes with verified asset names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/releases/v1.18.4.md
          test "$(gh release view v1.18.4 --json isDraft --jq .isDraft)" = false
          gh release edit v1.18.4 --notes-file docs/releases/v1.18.4.md
