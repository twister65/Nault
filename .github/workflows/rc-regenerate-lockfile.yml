# TEMPORARY RC workflow. Produces a registry-resolved, integrity-checked npm lockfile.
# Remove after successful reconciliation; it runs only for the initial manifest change.
name: RC npm lockfile reconciliation
on:
  push:
    branches: [upgrade/angular-22]
    paths:
      - package.json
      - .github/workflows/rc-regenerate-lockfile.yml
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'twister65/Nault'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Regenerate package-lock from npm registry metadata
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Validate resolved security patches and lockfile metadata
        run: |
          node - <<'NODE'
          const a = require('node:assert/strict');
          const f = require('node:fs');
          const lock = JSON.parse(f.readFileSync('package-lock.json','utf8'));
          const p = lock.packages;
          for (const [name, version] of Object.entries({'electron':'44.9.3','vite':'8.3.3','undici':'7.30.1','fast-uri':'3.1.9'})) {
            const v = p['node_modules/'+name];
            a.equal(v?.version, version, name+' should be '+version);
            a.match(v?.integrity || '', /^sha(512|1)-/, name+' must be integrity pinned');
          }
          a.equal(p['node_modules/node-gyp/node_modules/undici']?.version,'6.29.1','retain patched node-gyp undici 6.x');
          a.equal(p[''].devDependencies.electron,'44.9.3');
          console.log('Security patch resolution verified');
          NODE
      - name: Archive generated lockfile for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rc-package-lockfile
          path: package-lock.json
          retention-days: 3
      - name: Commit resolved package-lock to Angular 22
        run: |
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "Lockfile already matches manifest"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): resolve Electron 44.9.3, Vite 8.3.3, undici 7.30.1, fast-uri 3.1.9 lockfile"
          git push origin HEAD:upgrade/angular-22
