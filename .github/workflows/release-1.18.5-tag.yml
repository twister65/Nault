name: Create v1.18.5 release tag

# One-time, tightly scoped release bootstrap. Remove after v1.18.5 is drafted.
on:
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'docs/releases/v1.18.5.md'

jobs:
  release-tag:
    if: github.repository == 'twister65/Nault'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact release version and dispatch tagged packaging
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'),l=require('./package-lock.json'); if(p.version!=='1.18.5'||l.version!=='1.18.5'||l.packages[''].version!=='1.18.5') throw Error('Not a v1.18.5 release commit')"
          test -s docs/releases/v1.18.5.md
          if gh api "repos/$GH_REPO/git/ref/tags/v1.18.5" >/dev/null 2>&1; then
            echo "v1.18.5 already exists; nothing to do."
            exit 0
          fi
          gh api "repos/$GH_REPO/git/refs" -X POST -f ref="refs/tags/v1.18.5" -f sha="$COMMIT_SHA" >/dev/null
          # GITHUB_TOKEN tag pushes do not launch other workflows automatically.
          # workflow_dispatch is exempt from that restriction.
          gh workflow run electron_hash.yml --ref v1.18.5
          echo "Created v1.18.5 and dispatched Electron packaging from the tag."
