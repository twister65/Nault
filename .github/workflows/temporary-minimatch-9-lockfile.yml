name: Temporary minimatch 9 lockfile regeneration
on:
  push:
    branches:
      - fix/minimatch-9-electron-universal
    paths:
      - .github/workflows/temporary-minimatch-9-lockfile.yml
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore master lockfile as starting point
        run: |
          git fetch --depth=1 origin 02d3a646bbd7d04251f9021a0f14db0c81e0b88f
          git show FETCH_HEAD:package-lock.json > package-lock.json
      - name: Regenerate npm v2 lockfile with scoped override
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lockfile): resolve patched minimatch for Electron universal"
            git push origin HEAD:fix/minimatch-9-electron-universal
          fi

# Regenerate after refining the 9.x-only override.
