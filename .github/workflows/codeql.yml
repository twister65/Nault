name: CodeQL Advanced
on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '25 12 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true
  published-results:
    name: Published CodeQL results
    needs: analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Inspect published analyses and alerts for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-code-scanning.cjs
      - name: Preserve published result summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-scanning-${{ github.run_id }}-${{ github.run_attempt }}
          path: code-scanning-summary.json
          if-no-files-found: error
