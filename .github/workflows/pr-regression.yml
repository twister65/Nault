name: Nault regression checks

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Angular tests and desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      # Angular 13's webpack build needs this when running on supported Node 22.
      NODE_OPTIONS: --openssl-legacy-provider
      # Only typecheck Electron; downloading its binary is unnecessary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install native module build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev

      - name: Install dependencies from lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Test published-security gate policy
        run: node --test scripts/check-code-scanning.test.cjs

      - name: Test silent network recovery and server state
        run: node scripts/test-network-recovery.cjs

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Chrome is not installed on the runner."
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Build Angular desktop renderer
        run: npm run wallet:build-desktop

      - name: Validate production Web service worker and offline shell
        run: |
          npm run wallet:build
          node --test scripts/test-service-worker-config.test.cjs

      - name: Typecheck and compile Electron main/preload
        run: npm run desktop:compile

      - name: UIkit DOMPurify browser XSS regression
        run: node scripts/test-uikit-security.cjs

      - name: Test Ledger Bluetooth transport and reconnect handling
        run: node scripts/test-ledger-bluetooth.js

      - name: Run focused Nano / RsNano RPC tests
        run: npm test -- --include=src/app/services/api.service.spec.ts --include=src/app/services/wallet.service.spec.ts --include=src/app/services/websocket.service.spec.ts --include=src/app/services/rpc-transport.service.spec.ts --include=src/app/services/endpoint-policy.service.spec.ts --watch=false --browsers=ChromeHeadlessCI --progress=false

      - name: Run all Angular tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI --progress=false

      - name: Lint
        run: npm run lint
