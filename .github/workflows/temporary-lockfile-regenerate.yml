# Temporary one-shot maintenance helper. Remove after the lockfile is refreshed.
name: Temporary npm lockfile regeneration
on:
  push:
    branches:
      - fix/dependabot-follow-redirects-minimatch-2026
    paths:
      - .github/workflows/temporary-lockfile-regenerate.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate npm v2 lock
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Commit regenerated lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lockfile): align npm dependency graph with security overrides"
            git push origin HEAD:fix/dependabot-follow-redirects-minimatch-2026
          fi
