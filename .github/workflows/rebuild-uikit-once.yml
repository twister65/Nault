name: One-time regenerate UIkit security patch
on:
  push:
    branches: [fix/uikit-xss-upgrade]
    paths: ['.github/workflows/rebuild-uikit-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install native Ledger dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Install reproducible project dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Apply reviewed UIkit sanitization patch
        run: node scripts/patch-uikit-fragment.cjs
      - name: Generate matched minified UIkit distribution
        run: ./node_modules/.bin/terser src/assets/lib/base/uikit.js --compress --mangle --comments some --output src/assets/lib/base/uikit.min.js
      - name: Verify source and minified bundles against XSS payloads in Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export CHROME_BIN
          node scripts/test-uikit-security.cjs
      - name: Compile production wallet and Electron
        run: |
          npm run wallet:build-desktop
          npm run desktop:compile
      - name: Commit only generated source and minified bundles
        run: |
          set -euo pipefail
          git add -- src/assets/lib/base/uikit.js src/assets/lib/base/uikit.min.js
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security(uikit): sanitize HTML fragments in JS and minified bundles'
          git push origin HEAD:refs/heads/fix/uikit-xss-upgrade
