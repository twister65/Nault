name: Refresh url polyfill lockfile (temporary)
on:
  push:
    branches: [fix/angular-21-deprecated-dependencies]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'twister65/Nault' && github.ref == 'refs/heads/fix/angular-21-deprecated-dependencies'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Refresh lockfile without executing scripts
        run: npm install --package-lock-only --lockfile-version=2 --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify url polyfill and absence of legacy querystring
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          assert.equal(lock.lockfileVersion, 2);
          assert.equal(lock.packages['node_modules/url'].version, '0.11.4');
          assert.equal(lock.packages['node_modules/querystring'], undefined);
          assert.equal(lock.packages['node_modules/eslint'].version, '10.13.0');
          console.log('url and ESLint are synchronized; deprecated querystring removed.');
          NODE
      - name: Commit generated package-lock.json only to cleanup branch
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps): synchronize lockfile for url 0.11.4"
          git push origin HEAD:refs/heads/fix/angular-21-deprecated-dependencies
