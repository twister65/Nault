name: Deploy master to Vercel staging production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# A newer merge queues behind the current deployment; never cancel a build
# that Vercel may already be promoting.
concurrency:
  group: vercel-staging-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TEAM_ID: team_Ebt5y14x8wF4xEIGAR6p0tvE
      VERCEL_PROJECT_ID: prj_VfYJOUtUeNBmS4UsAFAlisipBQCN
      VERCEL_PROJECT_NAME: nault-wallet-staging
      PRODUCTION_HOST: nault-wallet-staging.vercel.app
    steps:
      - name: Ignore superseded master revisions
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/twister65/Nault/branches/master" | jq -er '.commit.sha')"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping superseded master SHA $GITHUB_SHA; current master is $latest_sha"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Vercel deployment credential
        if: steps.revision.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::Configure the repository Actions secret VERCEL_TOKEN (scoped to the Vercel team olaverre-1312)."
            echo "::error::GitHub Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Build exact master commit in Vercel Production
        if: steps.revision.outputs.deploy == 'true'
        id: publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg sha "$GITHUB_SHA" --arg name "$VERCEL_PROJECT_NAME" \
            --arg project "$VERCEL_PROJECT_ID" \
            '{name:$name,project:$project,target:"production",
              gitSource:{type:"github",org:"twister65",repo:"Nault",ref:"master",sha:$sha}}')"
          result="$(curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "$payload" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID&forceNew=1")"
          deployment_id="$(jq -er '.id // .deployment.id' <<< "$result")"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Vercel deployment: $deployment_id (master $GITHUB_SHA)"

      - name: Wait for Vercel production build
        if: steps.revision.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID")"
            status="$(jq -r '.readyState // .state // "UNKNOWN"' <<< "$response")"
            case "$status" in
              READY)
                echo "Vercel production build READY: $DEPLOYMENT_ID"
                exit 0
                ;;
              ERROR|CANCELED|BLOCKED)
                echo "::error::Vercel deployment $DEPLOYMENT_ID finished with status $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Vercel deployment $DEPLOYMENT_ID did not become READY within 15 minutes"
          exit 1

      - name: Verify production domain serves this commit
        if: steps.revision.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.publish.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$PRODUCTION_HOST?teamId=$VERCEL_TEAM_ID")"
            actual_id="$(jq -r '.id // ""' <<< "$response")"
            actual_sha="$(jq -r '.meta.githubCommitSha // ""' <<< "$response")"
            if [[ "$actual_id" == "$DEPLOYMENT_ID" && "$actual_sha" == "$GITHUB_SHA" ]]; then
              echo "Verified https://$PRODUCTION_HOST at $GITHUB_SHA"
              {
                echo "### Vercel staging production"
                echo "- URL: https://$PRODUCTION_HOST"
                echo "- Git commit: $GITHUB_SHA"
                echo "- Deployment: $DEPLOYMENT_ID"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production alias does not point at deployment $DEPLOYMENT_ID / commit $GITHUB_SHA"
          exit 1
