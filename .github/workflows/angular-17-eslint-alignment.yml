name: Align Angular 17 ESLint dependencies
on:
  push:
    branches: ['upgrade/angular-17']
permissions:
  contents: write
jobs:
  align:
    if: github.repository == 'twister65/Nault' && startsWith(github.event.head_commit.message, 'deps(angular17)')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'upgrade/angular-17'
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.5'
          cache: npm
      - name: Install native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Restore locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Align ESLint and TypeScript ESLint to Angular ESLint 17
        run: |
          npm install --save-dev --save-exact --legacy-peer-deps --no-audit --no-fund \
            eslint@8.57.1 \
            @typescript-eslint/eslint-plugin@7.11.0 \
            @typescript-eslint/parser@7.11.0
      - name: Commit dependency and lockfile update to branch
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');if(p.devDependencies['@typescript-eslint/parser']!=='7.11.0'||p.devDependencies.eslint!=='8.57.1')throw Error('Lint toolchain not aligned')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(angular17): align ESLint 8 and TypeScript ESLint 7"
            git push origin HEAD:upgrade/angular-17
          fi
      - name: Check lint after alignment
        run: npm run lint
