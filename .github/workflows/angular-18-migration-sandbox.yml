name: Migrate Angular 17 to 18 (sandbox)
on:
  push:
    branches: ['upgrade/angular-18']
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'twister65/Nault' && startsWith(github.event.head_commit.message, 'ci(angular18)')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'upgrade/angular-18'
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.5'
          cache: npm
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Install validated Angular 17 baseline
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Execute official Angular 18 migration schematics
        run: ./node_modules/.bin/ng update @angular/cli@18 @angular/core@18 --force
      - name: Align framework, localization and PWA
        run: |
          npm install --save --legacy-peer-deps --no-audit --no-fund \
            @angular-devkit/core@18 \
            @angular/localize@18 \
            @angular/service-worker@18 \
            zone.js@~0.14.10
      - name: Align Angular 18 ESLint and TypeScript
        run: |
          npm install --save-dev --legacy-peer-deps --no-audit --no-fund \
            @angular-eslint/builder@18 \
            @angular-eslint/eslint-plugin@18 \
            @angular-eslint/eslint-plugin-template@18 \
            @angular-eslint/schematics@18 \
            @angular-eslint/template-parser@18 \
            @angular/language-service@18 \
            typescript@~5.5.4
      - name: Use one Webpack instance for Angular browser and PoW worker
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('@angular-devkit/build-angular/package.json').dependencies.webpack")"
          npm install --save-dev --save-exact --legacy-peer-deps --no-audit --no-fund "webpack@$expected"
          node -e "const path=require('path');const angular=require.resolve('webpack',{paths:[path.dirname(require.resolve('@angular-devkit/build-angular/package.json'))]});const root=require.resolve('webpack');console.log({angular,root});if(angular!==root)throw Error('Webpack duplication')"
      - name: Verify Angular 18 versions
        run: |
          node -e "const p=require('./package.json');for(const [name,v] of Object.entries({...p.dependencies,...p.devDependencies})){if((name.startsWith('@angular/')||name.startsWith('@angular-eslint/')||name==='@angular-devkit/build-angular'||name==='@angular-devkit/core')&&!/^[~^]?18\./.test(v))throw Error(name+' '+v)}if(!/^[~^]?5\.5\./.test(p.devDependencies.typescript))throw Error('TypeScript unsupported');if(!/^[~^]?0\.14\./.test(p.dependencies['zone.js']))throw Error('Zone.js unsupported')"
          ./node_modules/.bin/ng version
      - name: Commit only to experimental Angular 18 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(angular): migrate core, CLI and lint tooling from 17 to 18"
            git push origin HEAD:upgrade/angular-18
          fi
      - name: Smoke test Angular 18 production Web bundle
        run: npm run wallet:build
