name: Temporary tar-fs security lockfile synchronization
# Keep tar-stream within major 2; tar-fs 2.1.4 itself now requires ^2.1.4
on:
  push:
    branches: [fix/tar-fs-2.1.4-ledger-security]
    paths:
      - package.json
      - .github/workflows/sync-tar-fs-security-lock.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'twister65/Nault'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate npm lockfile from registry with pinned patched tar-fs 2.1.4
        run: npm install --package-lock-only --lockfile-version=2 --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Assert patched tar-fs in all Ledger/native installation paths
        run: npm run test:tar-fs-security
      - name: Commit only the regenerated lockfile on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(security): resolve tar-fs 2.1.4 for Ledger native installation'
          git push origin HEAD:refs/heads/fix/tar-fs-2.1.4-ledger-security
