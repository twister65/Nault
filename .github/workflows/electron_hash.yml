name: Electron App Release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python with distutils for legacy node-gyp
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev rpm zstd libarchive-tools
      - name: Verify release tag matches package and lockfile versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),v=process.env.RELEASE_TAG.replace(/^v/,''); if(p.version!==v||l.version!==v||l.packages[''].version!==v) throw Error('Release tag/version mismatch')"
      - name: Install locked dependencies
        env:
          # node-usb 2.0.3 native bindings use Node 22 C++17/20 APIs on Apple Silicon.
          CXXFLAGS: ${{ runner.os == 'macOS' && '-std=c++20' || '' }}
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify tar APIs used by native build tooling
        run: node scripts/test-build-dependencies.cjs
      - name: Build and package without publishing
        run: |
          npm run desktop:build
          npm run desktop:local
      - name: Verify Linux packages and application-menu integration
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/verify-linux-packages.sh
      - name: Verify Linux update feed and SHA-512 for every package
        if: runner.os == 'Linux'
        run: node scripts/verify-linux-update-feed.cjs
      - name: Verify asset filename order and updater manifest
        run: node scripts/verify-release-asset-order.cjs
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop-app/build/*.AppImage
            desktop-app/build/*.deb
            desktop-app/build/*.rpm
            desktop-app/build/*.pkg.tar.zst
            desktop-app/build/*.dmg
            desktop-app/build/*.zip
            desktop-app/build/*.exe
            desktop-app/build/*.yml
            desktop-app/build/*.blockmap
  linux-install-smoke:
    name: Install / remove native package (${{ matrix.distro }})
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:26.04
          - distro: debian
            image: debian:13
          - distro: fedora
            image: fedora:44
          - distro: opensuse
            image: opensuse/leap:16.0
          - distro: arch
            image: archlinux/archlinux:base
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: desktop-ubuntu-24.04
          path: packages
      - name: Install / inspect / remove package in isolated container
        shell: bash
        env:
          DISTRO: ${{ matrix.distro }}
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          docker run --rm --pull=always \
            --security-opt no-new-privileges \
            --mount "type=bind,source=$PWD/packages,target=/packages,readonly" \
            --mount "type=bind,source=$PWD/scripts/test-linux-install-container.sh,target=/test-linux-install.sh,readonly" \
            --env DISTRO="$DISTRO" --env EXPECTED_VERSION="$version" \
            "$DISTRO_IMAGE" /bin/bash /test-linux-install.sh

  release-preview:
    name: Verify and preview OS-grouped downloads
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install metadata parser from lockfile
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-platforms
      - name: Assemble assets and the OS-grouped release preview
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node scripts/assemble-release-assets.cjs desktop-platforms release-ready release-downloads.md "$RELEASE_TAG"
          cat release-downloads.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-ready-assets
          if-no-files-found: error
          path: release-ready/*
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: release-preview-notes
          if-no-files-found: error
          path: release-downloads.md
          retention-days: 7
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-preview, linux-install-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-ready-assets
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: release-preview-notes
          path: .
      - name: Create or update a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if test -s "$notes_file"; then
            cp "$notes_file" prepared-notes.md
          else
            printf '%s\n' 'Desktop build artifacts; validation required before publication.' > prepared-notes.md
          fi
          printf '\n' >> prepared-notes.md
          cat release-downloads.md >> prepared-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state; then
            test "$(cat draft-state)" = true
            gh release edit "$RELEASE_TAG" --notes-file prepared-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "${RELEASE_TAG#v} (twister65 fork)" --notes-file prepared-notes.md
          fi
          # Only publish after every platform artifact exists and local digests verify.
          test "$(find packages -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l)" -ge 1
          test "$(find packages -maxdepth 1 -type f -name '*.rpm' | wc -l)" -ge 1
          test "$(find packages -maxdepth 1 -type f -name '*.pkg.tar.zst' | wc -l)" -ge 1
          # Every Linux updater needs the same manifest to choose its own package type.
          test -s packages/latest-linux.yml
          test "$(find packages -maxdepth 1 -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find packages -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find packages -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          test -s packages/latest-mac.yml
          test -s packages/latest.yml
          (cd packages && sha256sum --check SHA256SUMS)
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
