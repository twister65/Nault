name: Electron App Release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python with distutils for legacy node-gyp
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Verify release tag matches package and lockfile versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),v=process.env.RELEASE_TAG.replace(/^v/,''); if(p.version!==v||l.version!==v||l.packages[''].version!==v) throw Error('Release tag/version mismatch')"
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify tar APIs used by native build tooling
        run: node scripts/test-build-dependencies.cjs
      - name: Build and package without publishing
        run: |
          npm run desktop:build
          npm run desktop:local
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop-app/build/*.AppImage
            desktop-app/build/*.dmg
            desktop-app/build/*.exe
            desktop-app/build/*.yml
            desktop-app/build/*.blockmap
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true
      - name: Create or update a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state; then
            test "$(cat draft-state)" = true
          else
            notes_file="docs/releases/${RELEASE_TAG}.md"
            if test -s "$notes_file"; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "${RELEASE_TAG#v} (twister65 fork)" --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "${RELEASE_TAG#v} (twister65 fork)" --notes 'Desktop build artifacts; validation required before publication.'
            fi
          fi
          # Only publish after every platform artifact exists and local digests verify.
          test "$(find packages -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find packages -maxdepth 1 -type f -name '*.exe' | wc -l)" -ge 1
          test "$(find packages -maxdepth 1 -type f -name '*.dmg' | wc -l)" -ge 1
          (cd packages && sha256sum * > SHA256SUMS && sha256sum --check SHA256SUMS)
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
