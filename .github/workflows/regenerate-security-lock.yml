name: Regenerate bounded security lockfile (temporary)
on:
  push:
    branches: [fix/dependabot-critical]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install required native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libudev-dev libusb-1.0-0-dev
      - name: Regenerate npm lockfile with scoped security overrides
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify vulnerable dependencies resolve to safe versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = Object.entries(lock.packages || {});
          for (const [name, expected] of Object.entries({'cipher-base':'1.0.5','pbkdf2':'3.1.7','sha.js':'2.4.12'})) {
            const resolved = packages.filter(([path]) => path.endsWith('/node_modules/' + name));
            if (!resolved.length || resolved.some(([,data]) => data.version !== expected)) {
              throw new Error(name + ' did not resolve to ' + expected + ': ' + JSON.stringify(resolved));
            }
          }
          const forms = packages.filter(([path]) => path.endsWith('/node_modules/form-data'));
          if (forms.length < 2 || forms.some(([, data]) => !['2.5.6','4.0.6'].includes(data.version))) {
            throw new Error('Unexpected form-data versions: ' + JSON.stringify(forms));
          }
          console.log(JSON.stringify({patched:packages.filter(([p]) => /\/(cipher-base|form-data|pbkdf2|sha.js)$/.test(p)).map(([p,d]) => [p,d.version])},null,2));
          NODE
      - name: Verify lockfile is reproducible
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type-check Electron main and preload
        run: npm run desktop:compile
      - name: Commit only regenerated lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): resolve scoped critical security overrides'
          git push origin HEAD:fix/dependabot-critical
